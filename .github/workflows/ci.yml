name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Lint, build, test (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore POS.slnx

      # Lint: fails only on error-severity analyzer and style rules.
      - name: Lint (dotnet format)
        run: |
          dotnet format services/ApiGateway/ApiGateway.csproj --verify-no-changes --severity error --no-restore
          dotnet format services/IdentityService/IdentityService.csproj --verify-no-changes --severity error --no-restore
          dotnet format services/CatalogService/CatalogService.csproj --verify-no-changes --severity error --no-restore
          dotnet format services/OrderService/OrderService.csproj --verify-no-changes --severity error --no-restore
          dotnet format services/NotificationService/NotificationService.csproj --verify-no-changes --severity error --no-restore
          dotnet format shared/Pos.Shared/Pos.Shared.csproj --verify-no-changes --severity error --no-restore
          dotnet format tests/IdentityService.Tests/IdentityService.Tests.csproj --verify-no-changes --severity error --no-restore
          dotnet format tests/CatalogService.Tests/CatalogService.Tests.csproj --verify-no-changes --severity error --no-restore
          dotnet format tests/OrderService.Tests/OrderService.Tests.csproj --verify-no-changes --severity error --no-restore

      - name: Build
        run: dotnet build POS.slnx -c Release --no-restore

      - name: Test
        run: dotnet test POS.slnx -c Release --no-build --collect:"XPlat Code Coverage" --results-directory ./coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore

  images:
    name: Build container images
    needs: backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: ApiGateway
            context: services/ApiGateway
          - service: IdentityService
            context: services/IdentityService
          # These reference shared/Pos.Shared, so their build context is the repository root.
          - service: CatalogService
            context: .
          - service: OrderService
            context: .
          - service: NotificationService
            context: .
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Push to the registry only from main and release tags, never from pull requests.
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.service }}" | tr '[:upper:]' '[:lower:]' >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: services/${{ matrix.service }}/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.sha }}
            ${{ steps.name.outputs.image }}:${{ github.ref_type == 'tag' && github.ref_name || 'main' }}

  terraform:
    name: Terraform format and validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  # Release flow (tag v*): Terraform plan/apply, deploy to staging, Playwright E2E, then production.
  # Added in Phase 6 together with the ECS services and the E2E suite.
